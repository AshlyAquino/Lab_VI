openapi: 3.0.3

info:
  title: API de Administración de Cursos Universitarios
  description: API REST para administrar cursos universitarios.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local

tags:
  - name: Cursos
    description: Operaciones para administrar cursos universitarios

paths:

  /api/cursos:

    post:
      tags:
        - Cursos
      summary: Crear un curso
      description: Registra un nuevo curso universitario.
      operationId: crearCurso

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'

      responses:
        '201':
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

        '400':
          description: Datos de entrada inválidos

    get:
      tags:
        - Cursos
      summary: Consultar cursos
      description: Obtiene la lista de cursos registrados.
      operationId: consultarCursos

      responses:
        '200':
          description: Lista de cursos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'


  /api/cursos/buscar:

    get:
      tags:
        - Cursos
      summary: Consultar curso por código
      description: Busca un curso utilizando su código.
      operationId: consultarCursoPorCodigo

      parameters:
        - name: codigo
          in: query
          required: true
          description: Código del curso que se desea consultar.
          schema:
            type: string
            example: PROG101

      responses:
        '200':
          description: Curso encontrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

        '404':
          description: Curso no encontrado


  /api/cursos/{id}:

    put:
      tags:
        - Cursos
      summary: Actualizar un curso
      description: Actualiza la información de un curso existente.
      operationId: actualizarCurso

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del curso.
          schema:
            type: integer
            format: int64
            example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'

      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

        '400':
          description: Datos de entrada inválidos

        '404':
          description: Curso no encontrado


    delete:
      tags:
        - Cursos
      summary: Eliminar un curso
      description: Elimina un curso registrado.
      operationId: eliminarCurso

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del curso.
          schema:
            type: integer
            format: int64
            example: 1

      responses:
        '204':
          description: Curso eliminado correctamente

        '404':
          description: Curso no encontrado


components:

  schemas:

    Curso:
      type: object
      description: Información completa de un curso universitario.
      properties:

        id:
          type: integer
          format: int64
          description: Identificador único del curso.
          example: 1

        nombre:
          type: string
          description: Nombre del curso.
          example: Programación I

        codigo:
          type: string
          description: Código único del curso.
          example: PROG101

        creditos:
          type: integer
          description: Cantidad de créditos del curso.
          example: 4

        estado:
          type: string
          description: Estado actual del curso.
          example: ACTIVO


    CursoRequest:
      type: object
      description: Datos necesarios para crear o actualizar un curso.
      required:
        - nombre
        - codigo
        - creditos
        - estado

      properties:

        nombre:
          type: string
          example: Programación I

        codigo:
          type: string
          example: PROG101

        creditos:
          type: integer
          example: 4

        estado:
          type: string
          example: ACTIVO