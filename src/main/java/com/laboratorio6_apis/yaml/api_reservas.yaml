openapi: 3.0.3

info:
  title: API de Administración de Reservas de Hotel
  description: API REST para administrar las reservas de un hotel.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local

tags:
  - name: Reservas
    description: Operaciones para administrar reservas de hotel

paths:

  /api/reservas:

    post:
      tags:
        - Reservas
      summary: Crear una reserva
      description: Registra una nueva reserva en el hotel.
      operationId: crearReserva

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'

      responses:
        '201':
          description: Reserva creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

        '400':
          description: Datos de entrada inválidos

    get:
      tags:
        - Reservas
      summary: Consultar reservas
      description: Obtiene la lista de reservas registradas.
      operationId: consultarReservas

      responses:
        '200':
          description: Lista de reservas obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'


  /api/reservas/{id}:

    get:
      tags:
        - Reservas
      summary: Consultar reserva por ID
      description: Obtiene la información de una reserva específica.
      operationId: consultarReservaPorId

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la reserva.
          schema:
            type: integer
            format: int64
            example: 1

      responses:
        '200':
          description: Reserva encontrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

        '404':
          description: Reserva no encontrada


    put:
      tags:
        - Reservas
      summary: Actualizar una reserva
      description: Actualiza la información de una reserva existente.
      operationId: actualizarReserva

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la reserva.
          schema:
            type: integer
            format: int64
            example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'

      responses:
        '200':
          description: Reserva actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

        '400':
          description: Datos de entrada inválidos

        '404':
          description: Reserva no encontrada


  /api/reservas/{id}/cancelar:

    patch:
      tags:
        - Reservas
      summary: Cancelar una reserva
      description: Cambia el estado de una reserva a CANCELADA.
      operationId: cancelarReserva

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la reserva.
          schema:
            type: integer
            format: int64
            example: 1

      responses:
        '200':
          description: Reserva cancelada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

        '404':
          description: Reserva no encontrada


components:

  schemas:

    Reserva:
      type: object
      description: Información completa de una reserva de hotel.
      properties:

        id:
          type: integer
          format: int64
          description: Identificador único de la reserva.
          example: 1

        nombreCliente:
          type: string
          description: Nombre del cliente que realizó la reserva.
          example: Juan Pérez

        habitacion:
          type: string
          description: Número o identificación de la habitación reservada.
          example: 205

        fechaEntrada:
          type: string
          description: Fecha de entrada al hotel.
          example: 2026-09-20

        fechaSalida:
          type: string
          description: Fecha de salida del hotel.
          example: 2026-09-25

        estado:
          type: string
          description: Estado actual de la reserva.
          example: CONFIRMADA


    ReservaRequest:
      type: object
      description: Datos necesarios para crear o actualizar una reserva.
      required:
        - nombreCliente
        - habitacion
        - fechaEntrada
        - fechaSalida
        - estado

      properties:

        nombreCliente:
          type: string
          example: Juan Pérez

        habitacion:
          type: string
          example: 205

        fechaEntrada:
          type: string
          example: 2026-09-20

        fechaSalida:
          type: string
          example: 2026-09-25

        estado:
          type: string
          example: CONFIRMADA